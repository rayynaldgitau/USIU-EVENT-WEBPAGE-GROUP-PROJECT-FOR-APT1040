<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Forgot Password — USIU Events</title>
    <link rel="icon" type="image/png" href="https://www.usiu.ac.ke/assets/image/usiu-logo.png">
    <link rel="stylesheet" href="./css/styles.css">
    <script type="module" defer src="./JS/forgot.js"></script>
  </head>
  <body data-auth-page="forgot">
    <main id="main" class="auth-page">
      <section class="auth-hero">
        <div class="auth-container">
          <h1>Reset your password</h1>
          <p>Enter your registered email and we will send you a password reset link.</p>
        </div>
      </section>

      <section class="auth-main">
        <div class="auth-container">
          <section class="auth-card" aria-labelledby="forgot-heading">
            <h2 id="forgot-heading" class="card-title">Forgot password</h2>

            <div id="auth-status-forgot" class="auth-status" role="status" aria-live="polite"></div>

            <form id="forgot-form" novalidate>
              <div class="field">
                <label for="forgot-email">Email</label>
                <input
                  id="forgot-email"
                  name="email"
                  type="email"
                  required
                  autocomplete="email"
                  placeholder="your.email@usiu.ac.ke"
                >
              </div>

              <button type="submit" class="auth-primary-btn">
                <span>Send reset link</span>
              </button>

              <p class="auth-switch">
                Remembered your password?
                <a href="loginPage.html" class="text-link">Back to sign in</a>
              </p>
            </form>
          </section>
        </div>
      </section>
    </main>
  </body>
</html>
