<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Forgot Password — USIU Events</title>
    <link rel="icon" type="image/png" href="https://www.usiu.ac.ke/assets/image/usiu-logo.png">
    <link rel="stylesheet" href="./css/styles.css">
  </head>
  <body data-auth-page="forgot">
    <main id="main" class="auth-page">
      <section class="auth-hero">
        <div class="auth-container">
          <h1>Reset your password</h1>
          <p>Enter your registered email and we will send you a password reset link.</p>
        </div>
      </section>

      <section class="auth-main">
        <div class="auth-container">
          <section class="auth-card" aria-labelledby="forgot-heading">
            <h2 id="forgot-heading" class="card-title">Forgot password</h2>

            <div id="auth-status-forgot" class="auth-status" role="status" aria-live="polite"></div>

            <form id="forgot-form" novalidate>
              <div class="field">
                <label for="forgot-email">Email</label>
                <input
                  id="forgot-email"
                  name="email"
                  type="email"
                  required
                  autocomplete="email"
                  placeholder="your.email@usiu.ac.ke"
                >
              </div>

              <button type="submit" class="auth-primary-btn">
                <span>Send reset link</span>
              </button>

              <p class="auth-switch">
                Remembered your password?
                <a href="loginPage.html" class="text-link">Back to sign in</a>
              </p>
            </form>
          </section>
        </div>
      </section>
    </main>

    <!-- Inline Firebase password reset logic -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";
      import {
        getAuth,
        sendPasswordResetEmail,
        onAuthStateChanged,
      } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";

      // Your Firebase config (same as other pages)
      const firebaseConfig = {
        apiKey: "AIzaSyDrvrhISJEB_TmHm0GlqmpjvP1haFYFfVQ",
        authDomain: "usiueventswebpagebackend.firebaseapp.com",
        projectId: "usiueventswebpagebackend",
        storageBucket: "usiueventswebpagebackend.firebasestorage.app",
        messagingSenderId: "1070584142416",
        appId: "1:1070584142416:web:133d2ea364a5ab97d0cf55"
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);

      function setStatus(el, msg, type = "info") {
        if (!el) return;
        el.textContent = msg;
        el.classList.remove("status-info", "status-success", "status-error");
        el.classList.add(`status-${type}`);
      }

      function friendlyError(error) {
        if (!error?.code) return "Something went wrong.";
        switch (error.code) {
          case "auth/invalid-email":
            return "Invalid email format.";
          case "auth/user-not-found":
            return "No account found with that email.";
          case "auth/too-many-requests":
            return "Too many attempts. Try again later.";
          default:
            return "Unable to send reset email. Try again.";
        }
      }

      window.addEventListener("DOMContentLoaded", () => {
        const form = document.getElementById("forgot-form");
        const statusEl = document.getElementById("auth-status-forgot");
        const submitBtn = form?.querySelector('button[type="submit"]');

        if (!form) return;

        form.addEventListener("submit", async (e) => {
          e.preventDefault();
          if (!form.reportValidity()) return;

          const email = form.email.value.trim();
          if (!email) {
            setStatus(statusEl, "Please enter your email.", "error");
            return;
          }

          submitBtn.disabled = true;
          submitBtn.classList.add("is-loading");
          setStatus(statusEl, "Sending password reset email…", "info");

          try {
            await sendPasswordResetEmail(auth, email);
            setStatus(
              statusEl,
              "If this email is registered, a reset link has been sent. Please check your inbox.",
              "success"
            );
          } catch (err) {
            console.error(err);
            setStatus(statusEl, friendlyError(err), "error");
          } finally {
            submitBtn.disabled = false;
            submitBtn.classList.remove("is-loading");
          }
        });

        // Optional: if user is already logged in, redirect them away
        onAuthStateChanged(auth, (user) => {
          if (user) {
            // Redirect logged-in users away from forgot page if you want
            // window.location.href = "index.html";
          }
        });
      });
    </script>
  </body>
</html>
