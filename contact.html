<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact — USIU Events</title>
    <link rel="stylesheet" href="./css/styles.css">
    <script type="module" defer src="./JS/script.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to main content</a>
    <!-- Header -->
    <header class="site-header">
      <div class="brand">
        <a href="index.html">
          <img src="https://www.usiu.ac.ke/assets/image/usiu-logo.png" alt="USIU-Africa">
          USIU Events Hub
        </a>
      </div>

      <nav class="primary-nav">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="EventsListView.html">Events</a></li>
          <li><a href="Gallery.html">Gallery</a></li>
          <li><a href="aboutPage.html">About</a></li>
          <li><a href="contact.html" aria-current="page">Contact</a></li>
        </ul>
      </nav>

      <div class="auth-buttons">
        <a href="#" class="login-btn">Login / Register</a>
      </div>
    </header>
    <main id="main">
      <section>
        <h1>Contact</h1>
        <h2>Get in touch</h2>
      </section>
      <section>
        <h3>Registration Form</h3>
        <div id="form-status" role="status" aria-live="polite"></div>
        <form id="contact-form" data-enhanced="true">
          <div class="field">
            <label for="fullName">Full name</label>
            <input id="fullName" name="fullName" type="text" required minlength="2" placeholder="Jane Doe">
            <p class="hint" data-hint-for="fullName" hidden></p>
          </div>
          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" required placeholder="jane@example.com">
            <p class="hint" data-hint-for="email" hidden></p>
          </div>
          <div class="field">
            <label for="event">Event name</label>
            <input id="event" name="event" type="text" required minlength="3" placeholder="Startup Mixer">
            <p class="hint" data-hint-for="event" hidden></p>
          </div>
          <div class="field">
            <label for="message">Message</label>
            <textarea id="message" name="message" required minlength="10" rows="4" placeholder="Your note..."></textarea>
            <p class="hint" data-hint-for="message" hidden></p>
          </div>
          <button type="submit">Submit</button>
        </form>
      </section>
    </main>
    <footer>
      <small>&copy; USIU Events</small>
    </footer>
  </body>
</html>
